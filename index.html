<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shake Pi 🥧 - Potrząśnij po cyfry Pi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              900: '#4c1d95',
            }
          },
          animation: {
            'pop-in': 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'shake-hint': 'shake 1.5s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
          },
          keyframes: {
            popIn: {
              '0%': { transform: 'scale(0.3) translateY(20px)', opacity: '0' },
              '100%': { transform: 'scale(1) translateY(0)', opacity: '1' },
            },
            shake: {
              '0%, 100%': { transform: 'rotate(0deg)' },
              '20%': { transform: 'rotate(-10deg)' },
              '40%': { transform: 'rotate(10deg)' },
              '60%': { transform: 'rotate(-5deg)' },
              '80%': { transform: 'rotate(5deg)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Outfit & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      touch-action: manipulation;
    }
    .font-mono-pi {
      font-family: 'Fira Code', monospace;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.5);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden select-none">
  <!-- Dynamic Glow Backgrounds -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div id="bg-glow" class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl transition-all duration-500"></div>
    <div class="absolute top-1/2 -right-40 w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-pink-600/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 flex flex-col min-h-screen max-w-md mx-auto w-full px-5 py-6">
    <!-- Header -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-800/80">
      <div class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
          <span class="text-2xl font-black text-white">π</span>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-200 via-white to-purple-400">
            Shake Pi
          </h1>
          <p class="text-xs text-slate-400">Potrząśnij, aby odkryć cyfrę</p>
        </div>
      </div>
      <!-- Stat badge -->
      <div class="flex flex-col items-end">
        <span class="text-xs text-slate-400 font-medium">Cyfry</span>
        <span id="digit-count-badge" class="font-mono-pi text-sm font-bold px-2 py-0.5 rounded-full bg-purple-950/80 border border-purple-800/50 text-purple-300">
          0
        </span>
      </div>
    </header>

    <!-- Main interactive area -->
    <main class="flex-1 flex flex-col justify-center items-center py-6">
      
      <!-- Current Large Active Digit Spotlight -->
      <div class="relative w-full flex flex-col items-center mb-6">
        <div class="relative group">
          <!-- Ambient ring -->
          <div id="digit-ring" class="absolute -inset-2 rounded-3xl bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 opacity-30 blur-lg transition duration-500"></div>
          
          <!-- Card with latest digit -->
          <div id="latest-digit-card" class="relative w-44 h-44 rounded-3xl bg-slate-900/90 border border-slate-800/90 backdrop-blur-xl flex flex-col items-center justify-center shadow-2xl transition-transform duration-150">
            <span class="text-xs tracking-widest text-slate-400 uppercase font-semibold mb-1" id="digit-label">
              Ostatnia cyfra
            </span>
            <div id="latest-digit" class="font-mono-pi text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-b from-white to-purple-300 transition-all">
              3
            </div>
            <div id="digit-pos" class="text-xs text-purple-400/80 font-mono-pi mt-2">
              Start: 3.
            </div>
          </div>
        </div>

        <!-- Phone Motion Indicator & Shake Visualizer -->
        <div class="mt-6 flex flex-col items-center space-y-2">
          <div class="flex items-center space-x-2 text-slate-400 text-sm">
            <svg id="phone-icon" class="w-6 h-6 text-purple-400 animate-shake-hint" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="5" y="2" width="14" height="20" rx="3" stroke-width="2"/>
              <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span id="motion-status" class="font-medium text-slate-300">Zatrzęś telefonem!</span>
          </div>

          <!-- Accelerometer force bar -->
          <div class="w-48 h-2 bg-slate-800/80 rounded-full overflow-hidden border border-slate-700/50 p-0.5">
            <div id="force-bar" class="h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full w-0 transition-all duration-75"></div>
          </div>
        </div>
      </div>

      <!-- Pi Sequence Feed / History box -->
      <div class="w-full bg-slate-900/60 border border-slate-800/80 backdrop-blur-md rounded-2xl p-4 flex flex-col">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800/60">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ciąg liczby π</span>
          <button id="btn-copy" title="Skopiuj ciąg" class="text-xs flex items-center space-x-1 text-slate-400 hover:text-purple-300 transition px-2 py-1 rounded bg-slate-800/60">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span id="copy-text">Kopiuj</span>
          </button>
        </div>
        
        <!-- Digits container with wrap and auto-scroll -->
        <div id="digits-container" class="font-mono-pi text-base text-slate-200 tracking-wider leading-relaxed break-all h-28 overflow-y-auto pr-1">
          <!-- Digits injected dynamically -->
          <span class="text-purple-400 font-bold text-lg">3.</span>
        </div>
      </div>

    </main>

    <!-- Controls / Permission & Test button -->
    <footer class="space-y-3 pt-2">
      <!-- iOS Permission Request button (shown when needed) -->
      <button id="btn-permission" class="hidden w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold rounded-2xl shadow-lg shadow-amber-500/20 active:scale-[0.98] transition flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>Włącz czujnik ruchu (iOS)</span>
      </button>

      <!-- Primary Simulate Shake Button for testing / fallback -->
      <button id="btn-shake" class="w-full py-4 px-6 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:opacity-95 text-white font-extrabold text-base rounded-2xl shadow-xl shadow-purple-600/30 active:scale-[0.97] transition-all flex items-center justify-center space-x-3">
        <svg class="w-5 h-5 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span>Symuluj potrząśnięcie (Test)</span>
      </button>

      <!-- Sub-options: Sound, Sensitivity, Reset -->
      <div class="flex items-center justify-between text-xs text-slate-400 px-1 pt-1">
        <div class="flex items-center space-x-4">
          <label class="flex items-center space-x-1.5 cursor-pointer">
            <input type="checkbox" id="toggle-sound" checked class="rounded border-slate-700 text-purple-600 focus:ring-0 bg-slate-800">
            <span>Dźwięk</span>
          </label>
          <label class="flex items-center space-x-1.5 cursor-pointer">
            <input type="checkbox" id="toggle-vibrate" checked class="rounded border-slate-700 text-purple-600 focus:ring-0 bg-slate-800">
            <span>Wibracje</span>
          </label>
        </div>
        <button id="btn-reset" class="text-rose-400/80 hover:text-rose-300 transition underline underline-offset-2">
          Resetuj
        </button>
      </div>
    </footer>
  </div>

  <script src="piData.js"></script>
  <script src="app.js"></script>
</body>
</html>
